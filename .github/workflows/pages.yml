name: Publish storefront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the static storefront
        shell: bash
        run: |
          mkdir -p _site
          cp -a public/. _site/
          cp data/store.json _site/store.json
          sed -i 's/<body>/<body data-static-site="true">/' _site/index.html
          touch _site/.nojekyll
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
